<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic-JobFlow — Status</title>
  <meta name="description" content="Agentic-JobFlow v1.0 bare-bones status view: fact units, pipeline jobs, decision log, and application tracker." />
  <style>
    :root {
      --bg: #0d0f17;
      --surface: #161924;
      --border: #242840;
      --accent: #4f80ff;
      --green: #34d399;
      --red: #f87171;
      --yellow: #fbbf24;
      --text: #e2e8f0;
      --muted: #7c87a6;
      --font: 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font); font-size: 14px; line-height: 1.6;
      min-height: 100vh;
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 16px 32px; display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 700; color: var(--accent); }
    header span { color: var(--muted); font-size: 12px; }
    #refresh-badge {
      margin-left: auto; font-size: 11px; color: var(--muted);
      background: var(--bg); padding: 4px 10px; border-radius: 20px;
      border: 1px solid var(--border);
    }
    main { padding: 28px 32px; display: grid; gap: 24px; max-width: 1400px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; overflow: hidden;
    }
    .card h2 {
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted); margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .stat-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .stat {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 18px; flex: 1; min-width: 120px;
    }
    .stat .val { font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead tr { border-bottom: 1px solid var(--border); }
    th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
    td { padding: 8px 10px; border-bottom: 1px solid #1e2235; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(79,128,255,0.04); }
    .pill {
      display: inline-block; border-radius: 20px; padding: 2px 10px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    }
    .pill.a { background: rgba(52,211,153,0.15); color: var(--green); }
    .pill.b { background: rgba(251,191,36,0.15); color: var(--yellow); }
    .pill.discovered { background: rgba(79,128,255,0.15); color: var(--accent); }
    .pill.tailored { background: rgba(167,139,250,0.15); color: #a78bfa; }
    .pill.routed_a { background: rgba(52,211,153,0.15); color: var(--green); }
    .pill.routed_b { background: rgba(251,191,36,0.15); color: var(--yellow); }
    .pill.submitted { background: rgba(52,211,153,0.25); color: var(--green); }
    .pill.rejected { background: rgba(248,113,113,0.15); color: var(--red); }
    .pill.interviewing { background: rgba(52,211,153,0.35); color: #10b981; }
    .pill.offered { background: #14532d; color: #6ee7b7; }
    .score-bar { display: flex; align-items: center; gap: 6px; }
    .score-bar .bar { height: 6px; border-radius: 3px; background: var(--border); width: 60px; overflow: hidden; }
    .score-bar .fill { height: 100%; border-radius: 3px; background: var(--green); }
    .score-bar .fill.warn { background: var(--yellow); }
    .score-bar .fill.fail { background: var(--red); }
    .score-val { font-size: 12px; min-width: 36px; }
    .mono { font-family: 'Courier New', monospace; font-size: 11px; color: var(--muted); }
    #loading { display: flex; justify-content: center; padding: 60px; color: var(--muted); }
    .dot-blink { animation: blink 1s step-start infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .empty-state { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
    .truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
<header>
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
    <rect width="28" height="28" rx="8" fill="#4f80ff" opacity=".15"/>
    <path d="M7 14h14M14 7l7 7-7 7" stroke="#4f80ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Agentic-JobFlow</h1>
  <span>v1.0 — Status Dashboard</span>
  <div id="refresh-badge">Auto-refresh: 30s | Last: <span id="last-refresh">—</span></div>
</header>

<main id="main-content">
  <div id="loading">Loading<span class="dot-blink">...</span></div>
</main>

<script>
const API = '';

function scoreBar(score, threshold) {
  const pct = Math.round(score * 100);
  const cls = score >= threshold ? '' : score >= threshold * 0.85 ? 'warn' : 'fail';
  return `<div class="score-bar">
    <div class="bar"><div class="fill ${cls}" style="width:${pct}%"></div></div>
    <span class="score-val">${pct}%</span>
  </div>`;
}

function pill(text, cls) {
  return `<span class="pill ${cls || text.replace(/[^a-z]/gi,'_').toLowerCase()}">${text}</span>`;
}

function fmt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

function truncate(s, n=40) {
  return s && s.length > n ? s.slice(0,n) + '…' : (s || '—');
}

async function fetchAll() {
  const [factsR, jobsR, trackerR, decisionsR] = await Promise.all([
    fetch(`${API}/api/profile/facts`).then(r=>r.json()).catch(()=>({count:0,facts:[]})),
    fetch(`${API}/api/jobs?limit=20`).then(r=>r.json()).catch(()=>({count:0,jobs:[]})),
    fetch(`${API}/api/tracker`).then(r=>r.json()).catch(()=>({count:0,applications:[]})),
    fetch(`${API}/api/decisions?limit=10`).then(r=>r.json()).catch(()=>({count:0,decisions:[]})),
  ]);
  return { factsR, jobsR, trackerR, decisionsR };
}

function renderStats(factsR, jobsR, trackerR) {
  const statusCounts = {};
  (trackerR.applications||[]).forEach(a => {
    statusCounts[a.status] = (statusCounts[a.status]||0) + 1;
  });
  return `<div class="stat-row">
    <div class="stat"><div class="val">${factsR.count||0}</div><div class="lbl">Fact Units</div></div>
    <div class="stat"><div class="val">${jobsR.count||0}</div><div class="lbl">Jobs Ingested</div></div>
    <div class="stat"><div class="val">${trackerR.count||0}</div><div class="lbl">Applications</div></div>
    <div class="stat"><div class="val">${statusCounts['routed_a']||0}</div><div class="lbl">Path A Routed</div></div>
    <div class="stat"><div class="val">${statusCounts['submitted']||0}</div><div class="lbl">Submitted</div></div>
    <div class="stat"><div class="val">${statusCounts['interviewing']||0}</div><div class="lbl">Interviewing</div></div>
  </div>`;
}

function renderFacts(factsR) {
  const facts = (factsR.facts||[]).slice(0,8);
  if (!facts.length) return '<div class="empty-state">No fact units yet. POST /api/profile/ingest to get started.</div>';
  return `<table>
    <thead><tr><th>ID</th><th>Type</th><th>Text</th><th>Source</th></tr></thead>
    <tbody>${facts.map(f=>`<tr>
      <td class="mono">${f.fact_id}</td>
      <td>${pill(f.type)}</td>
      <td class="truncate" title="${f.text}">${truncate(f.text,60)}</td>
      <td class="mono">${truncate(f.source_document||'',20)}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function renderJobs(jobsR) {
  const jobs = (jobsR.jobs||[]).slice(0,8);
  if (!jobs.length) return '<div class="empty-state">No jobs yet. Use /api/jobs/scout or /api/jobs/manual.</div>';
  return `<table>
    <thead><tr><th>Company</th><th>Role</th><th>ATS</th><th>Confidence</th><th>Discovered</th></tr></thead>
    <tbody>${jobs.map(j=>`<tr>
      <td><strong>${truncate(j.company,25)}</strong></td>
      <td class="truncate">${truncate(j.role,30)}</td>
      <td>${pill(j.ats_type)}</td>
      <td>${scoreBar(j.source_confidence, 0.75)}</td>
      <td class="mono">${fmt(j.first_seen_at)}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function renderTracker(trackerR) {
  const apps = (trackerR.applications||[]).slice(0,10);
  if (!apps.length) return '<div class="empty-state">No applications tracked yet.</div>';
  return `<table>
    <thead><tr><th>Fingerprint</th><th>Status</th><th>Path</th><th>Outcome</th><th>Updated</th></tr></thead>
    <tbody>${apps.map(a=>`<tr>
      <td class="mono">${a.job_fingerprint.slice(0,12)}…</td>
      <td>${pill(a.status)}</td>
      <td>${a.path_taken ? pill(a.path_taken, a.path_taken==='PATH_A'?'a':'b') : '—'}</td>
      <td>${truncate(a.user_outcome||'',30)}</td>
      <td class="mono">${fmt(a.updated_at)}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function renderDecisions(decisionsR) {
  const decisions = (decisionsR.decisions||[]).slice(0,10);
  if (!decisions.length) return '<div class="empty-state">No routing decisions yet.</div>';
  return `<table>
    <thead><tr><th>Time</th><th>Route</th><th>Grounding</th><th>Completeness</th><th>Execution</th><th>Reason</th></tr></thead>
    <tbody>${decisions.map(d=>`<tr>
      <td class="mono">${fmt(d.timestamp)}</td>
      <td>${pill(d.route, d.route==='PATH_A'?'a':'b')}</td>
      <td>${scoreBar(d.grounding_score, 0.95)}</td>
      <td>${scoreBar(d.completeness_score, 0.85)}</td>
      <td>${scoreBar(d.execution_score, 0.90)}</td>
      <td class="mono truncate" title="${d.reason}">${truncate(d.reason,35)}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

async function render() {
  try {
    const { factsR, jobsR, trackerR, decisionsR } = await fetchAll();
    document.getElementById('main-content').innerHTML = `
      ${renderStats(factsR, jobsR, trackerR)}
      <div class="grid-2">
        <div class="card">
          <h2>🔍 Fact Units (Profile)</h2>
          ${renderFacts(factsR)}
        </div>
        <div class="card">
          <h2>📋 Jobs Pipeline</h2>
          ${renderJobs(jobsR)}
        </div>
      </div>
      <div class="card">
        <h2>📊 Decision Engine Log</h2>
        ${renderDecisions(decisionsR)}
      </div>
      <div class="card">
        <h2>🎯 Application Tracker</h2>
        ${renderTracker(trackerR)}
      </div>
    `;
  } catch (e) {
    document.getElementById('main-content').innerHTML =
      `<div class="card"><div class="empty-state" style="color:var(--red)">Error loading data: ${e.message}</div></div>`;
  }
  document.getElementById('last-refresh').textContent = new Date().toLocaleTimeString();
}

render();
setInterval(render, 30000);
</script>
</body>
</html>
